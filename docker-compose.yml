services:
  cloudprint:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: cloudprint:latest
    container_name: cloudprint
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CLOUDPRINT_DATA: /data
      CLOUDPRINT_ADMIN_USER: admin
      CLOUDPRINT_ADMIN_PASSWORD: ${CLOUDPRINT_ADMIN_PASSWORD:?请在 .env 中设置强密码}
      # With this on, requests without a session become the built-in guest and
      # can only use existing printers; adding/removing one still requires the
      # admin login. Leave it off to require a login for every page.
      CLOUDPRINT_ANONYMOUS: ${CLOUDPRINT_ANONYMOUS:-0}
      CLOUDPRINT_PUBLIC_URL: ${CLOUDPRINT_PUBLIC_URL:-}
      CLOUDPRINT_COOKIE_SECURE: ${CLOUDPRINT_COOKIE_SECURE:-false}
      CLOUDPRINT_TRUST_PROXY_HEADERS: ${CLOUDPRINT_TRUST_PROXY_HEADERS:-false}
      CLOUDPRINT_ENABLE_MDNS: "true"
      CLOUDPRINT_SCAN_CIDRS: ${CLOUDPRINT_SCAN_CIDRS:-}
      CLOUDPRINT_ALLOW_PRIVATE_SCAN: ${CLOUDPRINT_ALLOW_PRIVATE_SCAN:-true}
      CLOUDPRINT_DAILY_QUOTA: ${CLOUDPRINT_DAILY_QUOTA:-50}
      CLOUDPRINT_MAX_UPLOAD_MB: ${CLOUDPRINT_MAX_UPLOAD_MB:-50}
      CLOUDPRINT_RETENTION_DAYS: ${CLOUDPRINT_RETENTION_DAYS:-7}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
      # cupsd state is a runtime spool, not user data: bind it so queues
      # (PPD binding, enabled flags) survive a container rebuild.
      - ./data/cups:/etc/cups
      # The spool holds job state and the job counter. Persisting it keeps CUPS
      # job ids unique across restarts, so a stale id cannot match a new job.
      - ./data/spool:/var/spool/cups
      - ./data/cache:/var/cache/cups
    # mDNS discovery needs host networking or macvlan on most NAS setups.
    # Switch to network_mode: host and drop `ports` if your NAS supports it.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
